name: Source and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.12 pytest numpy pandas openpyxl scipy scikit-learn matplotlib biopython pyyaml
      - run: make verify
