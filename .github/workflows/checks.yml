name: Source and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff pytest numpy pandas openpyxl scipy scikit-learn matplotlib biopython pyyaml
      - run: ruff format --check scripts tests
      - run: ruff check scripts tests
      - run: python -m compileall -q scripts tests
      - run: find scripts -type f \( -name '*.sh' -o -name '*.slurm' -o -name '*.sbatch' \) -exec bash -n {} \;
      - run: PYTHONPATH=scripts/clustering python -m pytest -q tests scripts/clustering/tests
      - run: python scripts/checks/check_repo_ready.py
