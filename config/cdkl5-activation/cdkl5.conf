# CDKL5 MD analysis configuration

# ---------------------------------------------------------------------------
# Software
# ---------------------------------------------------------------------------
conda_root="${CONDA_PREFIX:-}"
python_env_name="varmdyn_env"
cpptraj_exe="${CPPTRAJ_BIN:-cpptraj}"

# ---------------------------------------------------------------------------
# Dataset roots
# ---------------------------------------------------------------------------
apo_stem="${VARMDYN_MD_SOURCE_ROOT:?Set the external simulation root}/03_mdsim"
holo_stem="${VARMDYN_MD_SOURCE_ROOT:?Set the external simulation root}/05_cdkl5atpmg"

# ---------------------------------------------------------------------------
# Canonical systems / replicas
# ---------------------------------------------------------------------------
replicates="cr1,cr2,cr3,cr4,cr5,cr6"

systems=(
"01_WT"
"02_L119R"
"03_D193H"
"04_G202E"
"05_Q219K"
"06_C291Y"
"07_S240T"
"08_H254R"
)

labels=(
"WT"
"L119R"
"D193H"
"G202E"
"Q219K"
"C291Y"
"S240T"
"H254R"
)

classes=(
"WT"
"PATHOGENIC"
"PATHOGENIC"
"PATHOGENIC"
"PATHOGENIC"
"PATHOGENIC"
"BENIGN"
"BENIGN"
)

# ---------------------------------------------------------------------------
# Canonical state representations
# ---------------------------------------------------------------------------
apo_top="02.leap/com/cdl.com.gas.equib.prmtop"
apo_traj="04.ptraj/com/{replicate}/traj-proc/production-25-to-29-500ns.{replicate}.striped.sampled-5.mdcrd.nc"
apo_ref="02.leap/com/cdl.com.gas.equib.pdb"

holo_top="02.leap/com/cdl.com.keepATPmg.equib.prmtop"
holo_traj="04.ptraj/com/{replicate}/traj-proc/production-25-to-29-500ns.{replicate}.keepATPmg.sampled-5.mdcrd.nc"
holo_ref="02.leap/com/cdl.com.keepATPmg.equib.pdb"

# Protein-only analyses select protein atoms/residues from the original holo trajectory.

# ---------------------------------------------------------------------------
# Sampling / masks
# ---------------------------------------------------------------------------
# Standard analysis-trajectory spacing: 0.1 ns = 100 ps.
frame_dt_ns="0.1"
protein_mask=":1-303"

# Broad initial QC-A core. Keep separate from the publication stable-core fit.
qc_core_mask=":13-299"

# Publication stable-core / primary selections (documentary shared definitions).
analysis_fit_core_mask=":40-41,63-75,87-92,112-118,132-138,194-200,275-280@CA"
analysis_primary_ca_mask=":11-296@CA"

# ---------------------------------------------------------------------------
# Window policy
# ---------------------------------------------------------------------------
# QC/equilibration diagnostics retain the complete available production trajectory.
qc_first_frame=1
qc_last_frame=-1
qc_stride=1

# All quantitative biological analyses use the common nominal 100-500 ns window.
# On the 0.1-ns standard-analysis trajectory, local frame 1001 is the first retained frame.
analysis_start_ns=100.0
analysis_end_ns=500.0
analysis_frame_dt_ns="${frame_dt_ns}"
analysis_first_frame=1001
analysis_last_frame=-1
analysis_stride=1
analysis_expected_frames=4000

# Step 8: analyze every retained 100-ps frame.
contact_stride=1
